name: Release to Git Branch and Create GitHub Release

on:
  workflow_run:
    workflows: ["PDFium WASM Build"]
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: Production
    strategy:
      fail-fast: false
      matrix:
        lock_type: [dev, prod]
    name: Release (${{ matrix.lock_type }})
    concurrency:
      group: pdfium-release-${{ matrix.lock_type }}
      cancel-in-progress: false
    env:
      EXPECTED_BUILDER_SHA: ${{ github.event.workflow_run.head_sha }}
      EXPECTED_BUILD_TYPE: ${{ matrix.lock_type }}
      EXPECTED_REPOSITORY: ${{ github.repository }}
      EXPECTED_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
      EXPECTED_WORKFLOW_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
      EXPECTED_WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      TRIGGER_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Only load SSH agent when releasing Dev target back to source repository
      - name: Setup SSH agent for compilation target
        if: ${{ matrix.lock_type == 'dev' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SOURCE_DEPLOY_KEY }}

      - name: Download candidate artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: pdfium-wasm-candidate-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}-${{ matrix.lock_type }}
          path: artifacts/

      - name: Download accepted build manifests
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: pdfium-wasm-acceptance-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: acceptance/

      - name: Validate release manifests
        run: |
          bash ci/build-info-contract.sh validate-release-pair \
            --candidate artifacts/build-info.json \
            --accepted "acceptance/${EXPECTED_BUILD_TYPE}/build-info.json" \
            --build-type "$EXPECTED_BUILD_TYPE" \
            --repository "$EXPECTED_REPOSITORY" \
            --builder-sha "$EXPECTED_BUILDER_SHA" \
            --checked-out-builder-sha "$(git rev-parse HEAD)" \
            --workflow-run-id "$EXPECTED_WORKFLOW_RUN_ID" \
            --workflow-run-number "$EXPECTED_WORKFLOW_RUN_NUMBER" \
            --workflow-run-attempt "$EXPECTED_WORKFLOW_RUN_ATTEMPT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Promote accepted build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash ci/promote-accepted-build.sh \
            --artifact-dir artifacts \
            --accepted-manifest "acceptance/${EXPECTED_BUILD_TYPE}/build-info.json" \
            --build-type "$EXPECTED_BUILD_TYPE" \
            --repository "$EXPECTED_REPOSITORY" \
            --source-repository "${{ secrets.SOURCE_REPOSITORY }}" \
            --workflow-id "$TRIGGER_WORKFLOW_ID" \
            --workflow-run-id "$EXPECTED_WORKFLOW_RUN_ID" \
            --workflow-run-attempt "$EXPECTED_WORKFLOW_RUN_ATTEMPT"
