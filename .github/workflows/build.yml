name: PDFium WASM Build

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - source-release-set-v1

concurrency:
  group: pdfium-build-${{ github.event.client_payload.release_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve-release-set:
    if: ${{ github.event_name == 'repository_dispatch' }}
    runs-on: ubuntu-latest
    environment: Candidate Build
    timeout-minutes: 10
    name: Resolve release set
    outputs:
      contract_version: ${{ steps.contract.outputs.contract_version }}
      source_revision: ${{ steps.contract.outputs.source_revision }}
      release_id: ${{ steps.contract.outputs.release_id }}
      targets: ${{ steps.contract.outputs.targets }}
      pdfium_source_sha: ${{ steps.source.outputs.pdfium_source_sha }}

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate dispatched contract
        id: contract
        env:
          CONFIGURED_SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          CONTRACT_VERSION: ${{ github.event.client_payload.contract_version }}
          SOURCE_REVISION: ${{ github.event.client_payload.source_revision }}
          RELEASE_ID: ${{ github.event.client_payload.release_id }}
          DISPATCH_MANIFEST: ${{ toJSON(github.event.client_payload.manifest) }}
        run: |
          [[ "$CONFIGURED_SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || {
            echo "::error::Candidate Build secret SOURCE_REPOSITORY is missing or invalid"
            exit 1
          }
          printf '%s\n' "$DISPATCH_MANIFEST" > release-set.json
          bash ci/build-info-contract.sh validate-source-manifest \
            --manifest release-set.json \
            --contract-version "$CONTRACT_VERSION" \
            --source-revision "$SOURCE_REVISION" \
            --release-id "$RELEASE_ID"
          {
            echo "contract_version=$CONTRACT_VERSION"
            echo "source_revision=$SOURCE_REVISION"
            echo "release_id=$RELEASE_ID"
            echo "targets=$(bash ci/build-info-contract.sh print-release-matrix \
              --manifest release-set.json \
              --contract-version "$CONTRACT_VERSION" \
              --source-revision "$SOURCE_REVISION" \
              --release-id "$RELEASE_ID")"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout compilation source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          ref: ${{ steps.contract.outputs.source_revision }}
          path: source
          ssh-key: ${{ secrets.SOURCE_READ_DEPLOY_KEY }}
          submodules: 'false'

      - name: Verify pinned source contract
        id: source
        env:
          SOURCE_REVISION: ${{ steps.contract.outputs.source_revision }}
          RELEASE_ID: ${{ steps.contract.outputs.release_id }}
        run: |
          python3 source/build/release_set.py --repo-root source verify \
            --source-revision "$SOURCE_REVISION" \
            --manifest release-set.json \
            --release-id "$RELEASE_ID"
          PDFIUM_ENTRY=$(git -C source ls-tree HEAD -- pdfium-src)
          PDFIUM_MODE=$(awk '{print $1}' <<< "$PDFIUM_ENTRY")
          PDFIUM_SOURCE_SHA=$(awk '{print $3}' <<< "$PDFIUM_ENTRY")
          if [[ "$PDFIUM_MODE" != "160000" ]] ||
             [[ ! "$PDFIUM_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::pdfium-src is not a pinned Git submodule"
            exit 1
          fi
          echo "pdfium_source_sha=$PDFIUM_SOURCE_SHA" >> "$GITHUB_OUTPUT"
  build-info-contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Build-info contract test

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare candidate transport tooling
        run: bash ci/install-age.sh

      - name: Test build-info contract
        run: bash ci/run-tests.sh

  native-preflight-test:
    if: ${{ github.event_name == 'repository_dispatch' }}
    needs: resolve-release-set
    runs-on: ubuntu-latest
    environment: Candidate Build
    timeout-minutes: 120
    name: Native preflight test
    outputs:
      focused_embedder_test_filter: ${{ steps.focused-test.outputs.filter }}
    env:
      ROOT: ${{ github.workspace }}
      SRC: ${{ github.workspace }}/pdfium-src
      NATIVE_OUT: ${{ github.workspace }}/pdfium-src/out/native-preflight

    steps:
      - name: Checkout compilation source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          ref: ${{ needs.resolve-release-set.outputs.source_revision }}
          ssh-key: ${{ secrets.SOURCE_READ_DEPLOY_KEY }}
          submodules: 'recursive'

      - name: Verify resolved source revisions
        env:
          EXPECTED_SOURCE_REPOSITORY_SHA: ${{ needs.resolve-release-set.outputs.source_revision }}
          EXPECTED_PDFIUM_SOURCE_SHA: ${{ needs.resolve-release-set.outputs.pdfium_source_sha }}
        run: |
          SOURCE_REPOSITORY_SHA=$(git rev-parse HEAD)
          PDFIUM_SOURCE_SHA=$(git -C pdfium-src rev-parse HEAD)

          if [[ "$SOURCE_REPOSITORY_SHA" != "$EXPECTED_SOURCE_REPOSITORY_SHA" ]]; then
            echo "::error::Source checkout differs from the resolved revision"
            exit 1
          fi

          if [[ "$PDFIUM_SOURCE_SHA" != "$EXPECTED_PDFIUM_SOURCE_SHA" ]]; then
            echo "::error::PDFium submodule differs from the resolved revision"
            exit 1
          fi

      - name: Setup depot_tools
        run: |
          git clone --depth 1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            /opt/depot-tools
          echo "/opt/depot-tools" >> "$GITHUB_PATH"

      - name: Build and run focused native regression
        id: focused-test
        run: |
          bash ci/preflight.sh
          FILTER=$(bash ci/preflight.sh --print-filter)
          echo "filter=$FILTER" >> "$GITHUB_OUTPUT"

  build:
    if: ${{ github.event_name == 'repository_dispatch' }}
    needs: resolve-release-set
    runs-on: ubuntu-latest
    environment: Candidate Build
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-release-set.outputs.targets) }}
    name: Candidate build (${{ matrix.build_role }}, ${{ matrix.target_id }})
    env:
      # Build paths
      ROOT: ${{ github.workspace }}
      SRC: ${{ github.workspace }}/pdfium-src
      OUT: ${{ github.workspace }}/pdfium-src/out/wasm
      PDFIUM: ${{ github.workspace }}

      # Emscripten (matching Dockerfile emsdk-base)
      EMSDK: /opt/emsdk
      EM_CACHE: /opt/emsdk/upstream/emscripten/cache
      EM_TOOLCHAIN_FILE: /opt/emsdk/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake

      # Build environment (matching Dockerfile line 8-14)
      INSTALL_DIR: /opt
      CFLAGS: -I/opt/include
      CXXFLAGS: -I/opt/include
      LDFLAGS: -L/opt/lib -I/opt/include
      EM_PKG_CONFIG_PATH: /opt/lib/pkgconfig:/opt/emsdk/upstream/emscripten/system/lib/pkgconfig
      PKG_CONFIG_PATH: /opt/lib/pkgconfig:/opt/emsdk/upstream/emscripten/system/lib/pkgconfig

      # Other
      TZ: Etc/UTC

    steps:
      # ============ Basic Setup ============
      # Checkout compilation target workspace root
      - name: Checkout compilation source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          ref: ${{ needs.resolve-release-set.outputs.source_revision }}
          ssh-key: ${{ secrets.SOURCE_READ_DEPLOY_KEY }}
          submodules: 'recursive'

      - name: Verify resolved source revisions
        id: source-check
        env:
          EXPECTED_SOURCE_REPOSITORY_SHA: ${{ needs.resolve-release-set.outputs.source_revision }}
          EXPECTED_PDFIUM_SOURCE_SHA: ${{ needs.resolve-release-set.outputs.pdfium_source_sha }}
        run: |
          SOURCE_REPOSITORY_SHA=$(git rev-parse HEAD)
          PDFIUM_SOURCE_SHA=$(git -C pdfium-src rev-parse HEAD)

          if [[ "$SOURCE_REPOSITORY_SHA" != "$EXPECTED_SOURCE_REPOSITORY_SHA" ]]; then
            echo "::error::Source checkout differs from the resolved revision"
            exit 1
          fi

          if [[ "$PDFIUM_SOURCE_SHA" != "$EXPECTED_PDFIUM_SOURCE_SHA" ]]; then
            echo "::error::PDFium submodule differs from the resolved revision"
            exit 1
          fi

          echo "pdfium_source_sha=$PDFIUM_SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout builder automation
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .builder-ci

      - name: Verify release target
        env:
          CONTRACT_VERSION: ${{ needs.resolve-release-set.outputs.contract_version }}
          SOURCE_REVISION: ${{ needs.resolve-release-set.outputs.source_revision }}
          RELEASE_ID: ${{ needs.resolve-release-set.outputs.release_id }}
          TARGET_ID: ${{ matrix.target_id }}
          BUILD_ROLE: ${{ matrix.build_role }}
          DISPATCH_MANIFEST: ${{ toJSON(github.event.client_payload.manifest) }}
        run: |
          printf '%s\n' "$DISPATCH_MANIFEST" > release-set.json
          python3 build/release_set.py verify \
            --source-revision "$SOURCE_REVISION" \
            --manifest release-set.json \
            --release-id "$RELEASE_ID" \
            --target-id "$TARGET_ID"
          bash .builder-ci/ci/build-info-contract.sh validate-source-manifest \
            --manifest release-set.json \
            --contract-version "$CONTRACT_VERSION" \
            --source-revision "$SOURCE_REVISION" \
            --release-id "$RELEASE_ID"
          jq -e --arg target_id "$TARGET_ID" --arg build_role "$BUILD_ROLE" \
            '.targets[] | select(.target_id == $target_id) | .build_role == $build_role' \
            release-set.json >/dev/null

      # ============ Cache Strategy (restore-only, save separately) ============
      - name: Setup cache key
        id: cache-settings
        run: |
          echo "key=emsdk-3.1.70-${{ runner.os }}-${{ matrix.target_id }}" >> $GITHUB_OUTPUT

      - name: Restore Emscripten SDK cache
        id: cache-emsdk
        uses: actions/cache/restore@v4
        with:
          path: /opt/emsdk
          key: ${{ steps.cache-settings.outputs.key }}

      - name: Restore CIPD bootstrap cache
        id: cache-cipd
        uses: actions/cache/restore@v4
        with:
          path: |
            /opt/pdfium-bootstrap
            ~/.vpython-root
            ~/.cipd
          key: cipd-bootstrap-${{ runner.os }}-v2

      - name: Restore Rust toolchain cache
        id: cache-rust
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-toolchain-${{ runner.os }}-v1

      # ============ System Dependencies (from Dockerfile) ============
      - name: Install base system packages
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pkg-config autoconf automake libtool ragel git yasm \
            subversion lsb-release tzdata tini \
            curl build-essential rsync python3 python3-pip ninja-build
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      # ============ Emscripten SDK 3.1.70 (from Dockerfile emsdk-base) ============
      - name: Install Emscripten SDK 3.1.70
        if: steps.cache-emsdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /opt/emsdk
          cd /opt/emsdk
          ./emsdk install 3.1.70 --shallow
          ./emsdk activate 3.1.70

      - name: Setup Emscripten environment
        run: |
          cd /opt/emsdk
          source ./emsdk_env.sh

          # Add to PATH
          echo "/opt/emsdk" >> $GITHUB_PATH
          echo "/opt/emsdk/upstream/emscripten" >> $GITHUB_PATH
          echo "/opt/emsdk/upstream/bin" >> $GITHUB_PATH

          # Only export essential Emscripten vars (prevent env pollution)
          echo "EMSDK=$EMSDK" >> $GITHUB_ENV
          echo "EM_CONFIG=$EM_CONFIG" >> $GITHUB_ENV

          # Verify
          emcc --version

      # ============ depot_tools (from Dockerfile depot-tools stage) ============
      - name: Setup depot_tools
        run: |
          if [ ! -d "/opt/depot-tools" ]; then
            git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git /opt/depot-tools
          fi

          echo "/opt/depot-tools" >> $GITHUB_PATH

          # Verify installation
          /opt/depot-tools/gclient --version

      # ============ CIPD Bootstrap (from Dockerfile pdfium-bootstrap + build.sh) ============
      - name: Bootstrap CIPD packages
        if: steps.cache-cipd.outputs.cache-hit != 'true'
        run: |
          mkdir -p /opt/pdfium-bootstrap
          cd /opt/pdfium-bootstrap

          gclient config --unmanaged https://pdfium.googlesource.com/pdfium.git
          gclient sync --no-history --shallow

          echo "✅ CIPD cache ready"

      # ============ PDFium Build Dependencies (from Dockerfile pdfium-deps) ============
      - name: Install PDFium build dependencies
        run: |
          cd /opt/pdfium-bootstrap
          bash -x ./pdfium/build/install-build-deps.sh --no-prompt

      # ============ Rust toolchain (from Dockerfile pdfium-deps) ============
      - name: Install Rust toolchain with watchexec
        if: steps.cache-rust.outputs.cache-hit != 'true'
        run: |
          curl -sSf https://sh.rustup.rs | bash -s -- -y
          source "$HOME/.cargo/env"
          cargo install --locked watchexec-cli
          strip "$HOME/.cargo/bin/watchexec"
          rm -rf "$HOME/.cargo/registry" "$HOME/.cargo/git"

      - name: Add Rust to PATH
        run: |
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # ============ Run Build Script ============
      - name: Build release target
        env:
          SOURCE_REVISION: ${{ needs.resolve-release-set.outputs.source_revision }}
          RELEASE_ID: ${{ needs.resolve-release-set.outputs.release_id }}
          TARGET_ID: ${{ matrix.target_id }}
        run: |
          [[ -z "${BUILD_VARIANT+x}" && -z "${PRODUCT_LOCK+x}" && -z "${BUILD_TYPE+x}" ]] || {
            echo "::error::Private build selectors are not accepted by this workflow"
            exit 1
          }
          python3 build/release_set.py build \
            --source-revision "$SOURCE_REVISION" \
            --release-id "$RELEASE_ID" \
            --target-id "$TARGET_ID"

      # ============ Assemble and Transport Candidate ============
      - name: Prepare candidate transport tooling
        run: bash .builder-ci/ci/install-age.sh

      - name: Prepare candidate transport
        env:
          CONTRACT_VERSION: ${{ needs.resolve-release-set.outputs.contract_version }}
          SOURCE_REVISION: ${{ needs.resolve-release-set.outputs.source_revision }}
          RELEASE_ID: ${{ needs.resolve-release-set.outputs.release_id }}
          TARGET_ID: ${{ matrix.target_id }}
          BUILD_ROLE: ${{ matrix.build_role }}
          MATERIALIZATION_RECIPIENT: ${{ vars.CANDIDATE_MATERIALIZATION_RECIPIENT }}
          MATERIALIZATION_KEY_ID: ${{ vars.CANDIDATE_MATERIALIZATION_KEY_ID }}
        run: |
          cleanup_plaintext() {
            rm -rf candidate-payload dist
            rm -f src/vendor/pdfium.wasm src/vendor/pdfium.js src/vendor/pdfium.cjs
            rm -f build/wasm/pdfium.wasm build/wasm/pdfium.js build/wasm/pdfium.cjs
          }
          trap cleanup_plaintext EXIT

          mkdir -p src/vendor candidate-payload candidate-metadata
          cp build/wasm/pdfium.wasm build/wasm/pdfium.js build/wasm/pdfium.cjs src/vendor/

          # Candidate-controlled package scripts run only in this unprivileged build job.
          pnpm install --frozen-lockfile=false --ignore-scripts
          pnpm run build

          [[ -f dist/pdfium.wasm ]] || {
            echo "::error::Static package build did not produce dist/pdfium.wasm"
            exit 1
          }
          cp -r dist candidate-payload/
          cp package.json README.md candidate-payload/

          bash .builder-ci/ci/build-info-contract.sh create-candidate \
            --output candidate-payload/build-info.json \
            --payload-dir candidate-payload \
            --source-build-info build/wasm/build-info.json \
            --release-manifest release-set.json \
            --contract-version "$CONTRACT_VERSION" \
            --source-revision "$SOURCE_REVISION" \
            --release-id "$RELEASE_ID" \
            --target-id "$TARGET_ID" \
            --build-timestamp "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-run-number "${{ github.run_number }}" \
            --workflow-run-attempt "${{ github.run_attempt }}" \
            --repository "${{ github.repository }}" \
            --builder-sha "${{ github.sha }}" \
            --pdfium-source-sha "${{ steps.source-check.outputs.pdfium_source_sha }}"
          cp candidate-payload/build-info.json "candidate-metadata/$TARGET_ID.json"

          bash .builder-ci/ci/candidate-transport.sh prepare \
            --input-dir candidate-payload \
            --output-dir candidate-transport \
            --recipient "$MATERIALIZATION_RECIPIENT" \
            --key-id "$MATERIALIZATION_KEY_ID" \
            --release-id "$RELEASE_ID" \
            --target-id "$TARGET_ID" \
            --source-revision "$SOURCE_REVISION" \
            --build-role "$BUILD_ROLE"
          cleanup_plaintext
          [[ ! -e candidate-payload && ! -e dist ]] || {
            echo "::error::Plaintext candidate cleanup failed"
            exit 1
          }
      - name: Upload candidate transport
        id: upload-candidate
        uses: actions/upload-artifact@v4
        with:
          name: pdfium-wasm-candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target_id }}
          path: candidate-transport/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Record candidate evidence
        env:
          TARGET_ID: ${{ matrix.target_id }}
          MATERIALIZATION_KEY_ID: ${{ vars.CANDIDATE_MATERIALIZATION_KEY_ID }}
        run: |
          bash .builder-ci/ci/build-info-contract.sh attach-candidate-artifact \
            --candidate "candidate-metadata/$TARGET_ID.json" \
            --transport-dir candidate-transport \
            --output "candidate-evidence/$TARGET_ID.json" \
            --expected-key-id "$MATERIALIZATION_KEY_ID" \
            --artifact-name "pdfium-wasm-candidate-${{ github.run_id }}-${{ github.run_attempt }}-$TARGET_ID" \
            --artifact-id "${{ steps.upload-candidate.outputs.artifact-id }}" \
            --artifact-digest "${{ steps.upload-candidate.outputs.artifact-digest }}"

      - name: Upload candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: pdfium-wasm-candidate-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target_id }}
          path: candidate-evidence/${{ matrix.target_id }}.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target_id }}
          path: |
            pdfium-src/out/wasm/*.log
            build/wasm/*.log
          if-no-files-found: ignore
          retention-days: 3
      # ============ Save Caches (always, even on failure) ============
      - name: Save Emscripten SDK cache
        uses: actions/cache/save@v4
        if: always() && steps.cache-emsdk.outputs.cache-hit != 'true'
        with:
          path: /opt/emsdk
          key: ${{ steps.cache-settings.outputs.key }}

      - name: Save CIPD bootstrap cache
        uses: actions/cache/save@v4
        if: always() && steps.cache-cipd.outputs.cache-hit != 'true'
        with:
          path: |
            /opt/pdfium-bootstrap
            ~/.vpython-root
            ~/.cipd
          key: cipd-bootstrap-${{ runner.os }}-v2

      - name: Save Rust toolchain cache
        uses: actions/cache/save@v4
        if: always() && steps.cache-rust.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-toolchain-${{ runner.os }}-v1

  accept-candidates:
    if: ${{ github.event_name == 'repository_dispatch' }}
    needs:
      - resolve-release-set
      - build-info-contract-test
      - native-preflight-test
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Accept candidate builds
    env:
      CONTRACT_VERSION: ${{ needs.resolve-release-set.outputs.contract_version }}
      SOURCE_REVISION: ${{ needs.resolve-release-set.outputs.source_revision }}
      RELEASE_ID: ${{ needs.resolve-release-set.outputs.release_id }}
      EXPECTED_BUILDER_SHA: ${{ github.sha }}
      EXPECTED_PDFIUM_SOURCE_SHA: ${{ needs.resolve-release-set.outputs.pdfium_source_sha }}
      EXPECTED_REPOSITORY: ${{ github.repository }}
      EXPECTED_WORKFLOW_RUN_ID: ${{ github.run_id }}
      EXPECTED_WORKFLOW_RUN_NUMBER: ${{ github.run_number }}
      EXPECTED_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
      FOCUSED_TEST_FILTER: ${{ needs.native-preflight-test.outputs.focused_embedder_test_filter }}

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Restore dispatched release manifest
        env:
          DISPATCH_MANIFEST: ${{ toJSON(github.event.client_payload.manifest) }}
        run: printf '%s\n' "$DISPATCH_MANIFEST" > release-set.json

      - name: Download candidate evidence
        uses: actions/download-artifact@v4
        with:
          pattern: pdfium-wasm-candidate-evidence-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: candidate-evidence
          merge-multiple: true

      - name: Validate and accept candidates
        run: |
          bash ci/build-info-contract.sh accept-candidate-set \
            --release-manifest release-set.json \
            --evidence-dir candidate-evidence \
            --output-dir accepted \
            --accepted-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --focused-test-filter "$FOCUSED_TEST_FILTER" \
            --contract-version "$CONTRACT_VERSION" \
            --source-revision "$SOURCE_REVISION" \
            --release-id "$RELEASE_ID" \
            --repository "$EXPECTED_REPOSITORY" \
            --builder-sha "$EXPECTED_BUILDER_SHA" \
            --pdfium-source-sha "$EXPECTED_PDFIUM_SOURCE_SHA" \
            --workflow-run-id "$EXPECTED_WORKFLOW_RUN_ID" \
            --workflow-run-number "$EXPECTED_WORKFLOW_RUN_NUMBER" \
            --workflow-run-attempt "$EXPECTED_WORKFLOW_RUN_ATTEMPT"

      - name: Upload accepted build manifests
        uses: actions/upload-artifact@v4
        with:
          name: pdfium-wasm-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: accepted/
          if-no-files-found: error
          retention-days: 1
