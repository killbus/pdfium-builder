name: PDFium WASM Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Prevent concurrent builds
concurrency:
  group: pdfium-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  resolve-source-revisions:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    name: Resolve source revisions
    outputs:
      source_repository_sha: ${{ steps.source-revisions.outputs.source_repository_sha }}
      pdfium_source_sha: ${{ steps.source-revisions.outputs.pdfium_source_sha }}

    steps:
      - name: Checkout compilation source
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          submodules: 'false'

      - name: Resolve immutable source revisions
        id: source-revisions
        run: |
          SOURCE_REPOSITORY_SHA=$(git rev-parse HEAD)
          PDFIUM_ENTRY=$(git ls-tree HEAD -- pdfium-src)
          PDFIUM_MODE=$(awk '{print $1}' <<< "$PDFIUM_ENTRY")
          PDFIUM_SOURCE_SHA=$(awk '{print $3}' <<< "$PDFIUM_ENTRY")

          if [[ ! "$SOURCE_REPOSITORY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Source repository did not resolve to a commit SHA"
            exit 1
          fi

          if [[ "$PDFIUM_MODE" != "160000" ]] ||
             [[ ! "$PDFIUM_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::pdfium-src is not a pinned Git submodule"
            exit 1
          fi

          echo "source_repository_sha=$SOURCE_REPOSITORY_SHA" >> "$GITHUB_OUTPUT"
          echo "pdfium_source_sha=$PDFIUM_SOURCE_SHA" >> "$GITHUB_OUTPUT"

  build-info-contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Build-info contract test

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v6

      - name: Test build-info contract
        run: bash ci/run-tests.sh

  native-preflight-test:
    needs: resolve-source-revisions
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 120
    name: Native preflight test
    outputs:
      focused_embedder_test_filter: ${{ steps.focused-test.outputs.filter }}
    env:
      ROOT: ${{ github.workspace }}
      SRC: ${{ github.workspace }}/pdfium-src
      NATIVE_OUT: ${{ github.workspace }}/pdfium-src/out/native-preflight

    steps:
      - name: Checkout compilation source
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          ref: ${{ needs.resolve-source-revisions.outputs.source_repository_sha }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          submodules: 'recursive'

      - name: Verify resolved source revisions
        env:
          EXPECTED_SOURCE_REPOSITORY_SHA: ${{ needs.resolve-source-revisions.outputs.source_repository_sha }}
          EXPECTED_PDFIUM_SOURCE_SHA: ${{ needs.resolve-source-revisions.outputs.pdfium_source_sha }}
        run: |
          SOURCE_REPOSITORY_SHA=$(git rev-parse HEAD)
          PDFIUM_SOURCE_SHA=$(git -C pdfium-src rev-parse HEAD)

          if [[ "$SOURCE_REPOSITORY_SHA" != "$EXPECTED_SOURCE_REPOSITORY_SHA" ]]; then
            echo "::error::Source checkout differs from the resolved revision"
            exit 1
          fi

          if [[ "$PDFIUM_SOURCE_SHA" != "$EXPECTED_PDFIUM_SOURCE_SHA" ]]; then
            echo "::error::PDFium submodule differs from the resolved revision"
            exit 1
          fi

      - name: Setup depot_tools
        run: |
          git clone --depth 1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            /opt/depot-tools
          echo "/opt/depot-tools" >> "$GITHUB_PATH"

      - name: Build and run focused native regression
        id: focused-test
        run: |
          bash ci/preflight.sh
          FILTER=$(bash ci/preflight.sh --print-filter)
          echo "filter=$FILTER" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-source-revisions
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        build_type: [dev, prod]
    name: Candidate build (${{ matrix.build_type }})
    env:
      # Build paths
      ROOT: ${{ github.workspace }}
      SRC: ${{ github.workspace }}/pdfium-src
      OUT: ${{ github.workspace }}/pdfium-src/out/wasm
      PDFIUM: ${{ github.workspace }}

      # Emscripten (matching Dockerfile emsdk-base)
      EMSDK: /opt/emsdk
      EM_CACHE: /opt/emsdk/upstream/emscripten/cache
      EM_TOOLCHAIN_FILE: /opt/emsdk/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake

      # Build environment (matching Dockerfile line 8-14)
      INSTALL_DIR: /opt
      CFLAGS: -I/opt/include
      CXXFLAGS: -I/opt/include
      LDFLAGS: -L/opt/lib -I/opt/include
      EM_PKG_CONFIG_PATH: /opt/lib/pkgconfig:/opt/emsdk/upstream/emscripten/system/lib/pkgconfig
      PKG_CONFIG_PATH: /opt/lib/pkgconfig:/opt/emsdk/upstream/emscripten/system/lib/pkgconfig

      # Other
      TZ: Etc/UTC

    steps:
      # ============ Basic Setup ============
      # Checkout compilation target workspace root
      - name: Checkout compilation source
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          ref: ${{ needs.resolve-source-revisions.outputs.source_repository_sha }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          submodules: 'recursive'

      - name: Verify resolved source revisions
        id: source-revisions
        env:
          EXPECTED_SOURCE_REPOSITORY_SHA: ${{ needs.resolve-source-revisions.outputs.source_repository_sha }}
          EXPECTED_PDFIUM_SOURCE_SHA: ${{ needs.resolve-source-revisions.outputs.pdfium_source_sha }}
        run: |
          SOURCE_REPOSITORY_SHA=$(git rev-parse HEAD)
          PDFIUM_SOURCE_SHA=$(git -C pdfium-src rev-parse HEAD)

          if [[ "$SOURCE_REPOSITORY_SHA" != "$EXPECTED_SOURCE_REPOSITORY_SHA" ]]; then
            echo "::error::Source checkout differs from the resolved revision"
            exit 1
          fi

          if [[ "$PDFIUM_SOURCE_SHA" != "$EXPECTED_PDFIUM_SOURCE_SHA" ]]; then
            echo "::error::PDFium submodule differs from the resolved revision"
            exit 1
          fi

          echo "source_repository_sha=$SOURCE_REPOSITORY_SHA" >> "$GITHUB_OUTPUT"
          echo "pdfium_source_sha=$PDFIUM_SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout builder automation
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .builder-ci

      # ============ Cache Strategy (restore-only, save separately) ============
      - name: Setup cache key
        id: cache-settings
        run: |
          echo "key=emsdk-3.1.70-${{ runner.os }}-${{ matrix.build_type }}" >> $GITHUB_OUTPUT

      - name: Restore Emscripten SDK cache
        id: cache-emsdk
        uses: actions/cache/restore@v4
        with:
          path: /opt/emsdk
          key: ${{ steps.cache-settings.outputs.key }}

      - name: Restore CIPD bootstrap cache
        id: cache-cipd
        uses: actions/cache/restore@v4
        with:
          path: |
            /opt/pdfium-bootstrap
            ~/.vpython-root
            ~/.cipd
          key: cipd-bootstrap-${{ runner.os }}-v2

      - name: Restore Rust toolchain cache
        id: cache-rust
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-toolchain-${{ runner.os }}-v1

      # ============ System Dependencies (from Dockerfile) ============
      - name: Install base system packages
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pkg-config autoconf automake libtool ragel git yasm \
            subversion lsb-release tzdata tini \
            curl build-essential rsync python3 python3-pip ninja-build
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ============ Emscripten SDK 3.1.70 (from Dockerfile emsdk-base) ============
      - name: Install Emscripten SDK 3.1.70
        if: steps.cache-emsdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /opt/emsdk
          cd /opt/emsdk
          ./emsdk install 3.1.70 --shallow
          ./emsdk activate 3.1.70

      - name: Setup Emscripten environment
        run: |
          cd /opt/emsdk
          source ./emsdk_env.sh

          # Add to PATH
          echo "/opt/emsdk" >> $GITHUB_PATH
          echo "/opt/emsdk/upstream/emscripten" >> $GITHUB_PATH
          echo "/opt/emsdk/upstream/bin" >> $GITHUB_PATH

          # Only export essential Emscripten vars (prevent env pollution)
          echo "EMSDK=$EMSDK" >> $GITHUB_ENV
          echo "EM_CONFIG=$EM_CONFIG" >> $GITHUB_ENV

          # Verify
          emcc --version

      # ============ depot_tools (from Dockerfile depot-tools stage) ============
      - name: Setup depot_tools
        run: |
          if [ ! -d "/opt/depot-tools" ]; then
            git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git /opt/depot-tools
          fi

          echo "/opt/depot-tools" >> $GITHUB_PATH

          # Verify installation
          /opt/depot-tools/gclient --version

      # ============ CIPD Bootstrap (from Dockerfile pdfium-bootstrap + build.sh) ============
      - name: Bootstrap CIPD packages
        if: steps.cache-cipd.outputs.cache-hit != 'true'
        run: |
          mkdir -p /opt/pdfium-bootstrap
          cd /opt/pdfium-bootstrap

          gclient config --unmanaged https://pdfium.googlesource.com/pdfium.git
          gclient sync --no-history --shallow

          echo "✅ CIPD cache ready"

      # ============ PDFium Build Dependencies (from Dockerfile pdfium-deps) ============
      - name: Install PDFium build dependencies
        run: |
          cd /opt/pdfium-bootstrap
          bash -x ./pdfium/build/install-build-deps.sh --no-prompt

      # ============ Rust toolchain (from Dockerfile pdfium-deps) ============
      - name: Install Rust toolchain with watchexec
        if: steps.cache-rust.outputs.cache-hit != 'true'
        run: |
          curl -sSf https://sh.rustup.rs | bash -s -- -y
          source "$HOME/.cargo/env"
          cargo install --locked watchexec-cli
          strip "$HOME/.cargo/bin/watchexec"
          rm -rf "$HOME/.cargo/registry" "$HOME/.cargo/git"

      - name: Add Rust to PATH
        run: |
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # ============ Run Build Script ============
      - name: Resolve product lock
        run: |
          PRODUCT_LOCK=$(bash .builder-ci/ci/build-info-contract.sh print-product-lock \
            --build-type "${{ matrix.build_type }}")
          echo "PRODUCT_LOCK=$PRODUCT_LOCK" >> "$GITHUB_ENV"

      - name: Build PDFium
        run: bash scripts/build.sh

      # ============ Collect Artifacts ============
      - name: Collect build artifacts
        run: |
          mkdir -p dist
          cp -r build/wasm/* dist/ || true
          cp pdfium-src/out/wasm/obj/libpdfium.a dist/ || true
          cp -r src/vendor/* dist/ || true
          
          # Copy source files needed for rollup bundling
          cp -r src dist/
          cp package.json README.md rollup.config.js tsconfig.json dist/
          
          bash .builder-ci/ci/build-info-contract.sh create-candidate \
            --output dist/build-info.json \
            --build-type "${{ matrix.build_type }}" \
            --build-timestamp "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-run-number "${{ github.run_number }}" \
            --workflow-run-attempt "${{ github.run_attempt }}" \
            --repository "${{ github.repository }}" \
            --builder-sha "${{ github.sha }}" \
            --source-repository-sha "${{ steps.source-revisions.outputs.source_repository_sha }}" \
            --pdfium-source-sha "${{ steps.source-revisions.outputs.pdfium_source_sha }}"

      - name: Upload candidate artifacts
        id: upload-candidate
        uses: actions/upload-artifact@v4
        with:
          name: pdfium-wasm-candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.build_type }}
          path: dist/
          retention-days: 7
          compression-level: 9

      - name: Record candidate artifact evidence
        run: |
          bash .builder-ci/ci/build-info-contract.sh attach-candidate-artifact \
            --candidate dist/build-info.json \
            --output candidate-evidence/${{ matrix.build_type }}.json \
            --artifact-name "pdfium-wasm-candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.build_type }}" \
            --artifact-id "${{ steps.upload-candidate.outputs.artifact-id }}" \
            --artifact-digest "${{ steps.upload-candidate.outputs.artifact-digest }}"

      - name: Upload candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: pdfium-wasm-candidate-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.build_type }}
          path: candidate-evidence/${{ matrix.build_type }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.build_type }}
          path: |
            pdfium-src/out/wasm/*.log
            build/wasm/*.log
          if-no-files-found: ignore
          retention-days: 3

      # ============ Save Caches (always, even on failure) ============
      - name: Save Emscripten SDK cache
        uses: actions/cache/save@v4
        if: always() && steps.cache-emsdk.outputs.cache-hit != 'true'
        with:
          path: /opt/emsdk
          key: ${{ steps.cache-settings.outputs.key }}

      - name: Save CIPD bootstrap cache
        uses: actions/cache/save@v4
        if: always() && steps.cache-cipd.outputs.cache-hit != 'true'
        with:
          path: |
            /opt/pdfium-bootstrap
            ~/.vpython-root
            ~/.cipd
          key: cipd-bootstrap-${{ runner.os }}-v2

      - name: Save Rust toolchain cache
        uses: actions/cache/save@v4
        if: always() && steps.cache-rust.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-toolchain-${{ runner.os }}-v1

  accept-candidates:
    needs:
      - resolve-source-revisions
      - build-info-contract-test
      - native-preflight-test
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Accept candidate builds
    env:
      EXPECTED_BUILDER_SHA: ${{ github.sha }}
      EXPECTED_SOURCE_REPOSITORY_SHA: ${{ needs.resolve-source-revisions.outputs.source_repository_sha }}
      EXPECTED_PDFIUM_SOURCE_SHA: ${{ needs.resolve-source-revisions.outputs.pdfium_source_sha }}
      EXPECTED_REPOSITORY: ${{ github.repository }}
      EXPECTED_WORKFLOW_RUN_ID: ${{ github.run_id }}
      EXPECTED_WORKFLOW_RUN_NUMBER: ${{ github.run_number }}
      EXPECTED_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
      FOCUSED_TEST_FILTER: ${{ needs.native-preflight-test.outputs.focused_embedder_test_filter }}

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Download candidate evidence
        uses: actions/download-artifact@v4
        with:
          pattern: pdfium-wasm-candidate-evidence-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: candidate-evidence
          merge-multiple: true

      - name: Validate and accept candidates
        run: |
          bash ci/build-info-contract.sh accept-candidate-set \
            --evidence-dir candidate-evidence \
            --output-dir accepted \
            --accepted-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --focused-test-filter "$FOCUSED_TEST_FILTER" \
            --repository "$EXPECTED_REPOSITORY" \
            --builder-sha "$EXPECTED_BUILDER_SHA" \
            --source-repository-sha "$EXPECTED_SOURCE_REPOSITORY_SHA" \
            --pdfium-source-sha "$EXPECTED_PDFIUM_SOURCE_SHA" \
            --workflow-run-id "$EXPECTED_WORKFLOW_RUN_ID" \
            --workflow-run-number "$EXPECTED_WORKFLOW_RUN_NUMBER" \
            --workflow-run-attempt "$EXPECTED_WORKFLOW_RUN_ATTEMPT"

      - name: Upload accepted build manifests
        uses: actions/upload-artifact@v4
        with:
          name: pdfium-wasm-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: accepted/
          if-no-files-found: error
          retention-days: 7
